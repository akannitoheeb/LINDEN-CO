<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linden & Co.</title>
<style>
:root{
  --bg:#faf9f7; --surface:#ffffff; --ink:#1a1a1a; --sub:#6b6b6b;
  --line:#e7e3dd; --accent:#9c7b4f; --accent-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15130f; --surface:#1e1b16; --ink:#f3efe8; --sub:#b0a99c;
    --line:#332e26; --accent:#c9a46a; --accent-ink:#15130f;
  }
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:Georgia,'Times New Roman',serif;}
header{
  position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line);
  padding:18px 20px; display:flex; justify-content:space-between; align-items:center;
}
.logo{font-size:22px; letter-spacing:2px; font-weight:bold;}
.logo span{color:var(--accent);}
.hero{text-align:center; padding:70px 20px 50px;}
.hero h1{font-size:clamp(28px,5vw,46px); margin:0 0 14px;}
.hero p{color:var(--sub); max-width:520px; margin:0 auto 24px; font-family:Arial,sans-serif;}
.btn{display:inline-block; background:var(--accent); color:var(--accent-ink); padding:13px 30px; text-decoration:none; font-family:Arial,sans-serif; letter-spacing:1px; font-size:13px; border:none; cursor:pointer; border-radius:2px;}
section{padding:40px 20px; max-width:1100px; margin:0 auto;}
h2{text-align:center; font-size:26px; margin-bottom:30px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:22px;}
.card{background:var(--surface); border:1px solid var(--line); overflow:hidden; border-radius:4px;}
.thumb{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; color:#fff; font-family:Arial,sans-serif; font-size:13px; background:linear-gradient(135deg,var(--accent),#4a3a24);}
.card .info{padding:14px;}
.card h3{margin:0 0 4px; font-size:16px;}
.card .price{color:var(--accent); font-family:Arial,sans-serif; font-weight:bold; margin:0;}
.card .cat{font-family:Arial,sans-serif; font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:1px;}
.empty,.loading{text-align:center; color:var(--sub); font-family:Arial,sans-serif; padding:30px;}
.signup{background:var(--surface); border-top:1px solid var(--line); border-bottom:1px solid var(--line); text-align:center;}
.signup form{display:flex; gap:10px; max-width:380px; margin:18px auto 0; flex-wrap:wrap; justify-content:center;}
.signup input{flex:1; min-width:200px; padding:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-family:Arial,sans-serif; border-radius:2px;}
footer{text-align:center; padding:30px 20px; color:var(--sub); font-family:Arial,sans-serif; font-size:12px;}
.msg{font-size:12px; margin-top:8px; color:var(--sub); font-family:Arial,sans-serif;}
</style>
</head>
<body>

<header>
  <div class="logo">LINDEN <span>&</span> CO.</div>
</header>

<div class="hero">
  <h1>Quietly good taste.</h1>
  <p>Fashion, accessories and gadget essentials, curated — not dumped on you.</p>
  <a href="#shop" class="btn">Browse the edit</a>
</div>

<section id="shop">
  <h2>The Current Edit</h2>
  <div class="grid" id="productGrid"><div class="loading">Loading products…</div></div>
</section>

<section class="signup" id="join">
  <h2 style="margin-bottom:6px;">Join the list</h2>
  <p style="color:var(--sub); font-family:Arial,sans-serif; font-size:14px;">First look at new pieces, before anyone else.</p>
  <!-- Replace this form's action with your Brevo embed form action URL when ready -->
  <form id="signupForm">
    <input type="email" id="emailInput" placeholder="you@email.com" required>
    <button class="btn" type="submit">Join</button>
  </form>
  <div class="msg" id="signupMsg"></div>
</section>

<footer>Linden & Co. — curated, not mass-produced.</footer>

<script>
// 1. Paste your published Google Sheet CSV link below, between the quotes.
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1j9qvHRkov44uvnASDlgisn_4LxtIw6x2FlUKWffoSAY/export?format=csv&gid=0";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// Simple CSV parser — works fine as long as your product names/prices don't contain commas.
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h=>h.trim().toLowerCase());
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const cells = line.split(',').map(c=>c.trim());
    const row = {};
    headers.forEach((h,i)=> row[h] = cells[i] || '');
    return row;
  });
}

function renderProducts(products){
  const grid = document.getElementById('productGrid');
  if(!products.length){ grid.innerHTML = '<div class="empty">New pieces coming soon.</div>'; return; }
  grid.innerHTML = products.map(p => `
    <div class="card">
      <div class="thumb">${esc((p.name||'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase())}</div>
      <div class="info">
        <div class="cat">${esc(p.category||'')}</div>
        <h3>${esc(p.name||'')}</h3>
        <p class="price">${esc(p.price||'')}</p>
      </div>
    </div>`).join('');
}

async function loadProducts(){
  if(SHEET_CSV_URL.includes('PASTE_YOUR')){
    document.getElementById('productGrid').innerHTML =
      '<div class="empty">Add your Google Sheet CSV link in the code to show products here.</div>';
    return;
  }
  try{
    const res = await fetch(SHEET_CSV_URL);
    const text = await res.text();
    renderProducts(parseCSV(text));
  }catch(e){
    document.getElementById('productGrid').innerHTML =
      '<div class="empty">Could not load products right now.</div>';
  }
}
loadProducts();

document.getElementById('signupForm').addEventListener('submit', function(e){
  e.preventDefault();
  // Swap this for a real submit to your Brevo form action once connected.
  document.getElementById('signupMsg').textContent =
    "Thanks! (Connect this form to your Brevo list to start capturing emails.)";
  e.target.reset();
});
</script>
</body>
</html>
